services:
  rabbitmq:
    image: docker.io/rabbitmq:4-management
    ports:
      - "127.0.0.1:10001:15672"
      - "127.0.0.1:10002:5672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin"

  gitea:
    build:
      context: .
      dockerfile: infra/gitea/Containerfile
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea_db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__security__INSTALL_LOCK=true
      - GITEA_CUSTOM=/data/gitea/custom
    ports:
      - "127.0.0.1:10005:3000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk update
        apk add valkey-cli jq
        mkdir -p /data/gitea/custom/conf
        cp /opt/spr-gitea/app.ini /data/gitea/custom/conf/app.ini
        cat /opt/spr-gitea/setup.sh >> /etc/s6/gitea/setup
        /usr/bin/entrypoint /usr/bin/s6-svscan /etc/s6
    depends_on:
      gitea_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -h valkey -p 6379 EXISTS gitea:config | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio_pass
      - MINIO_BROWSER_REDIRECT_URL=http://127.0.0.1:10004
    ports:
      - "127.0.0.1:10004:9001"
      - "127.0.0.1:10003:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/safe.jsonl:/seed/safe.jsonl:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set spr http://minio:9000 minio minio_pass
        mc mb --ignore-existing spr/behavior
        mc cp /seed/safe.jsonl spr/behavior/behavior/baseline/behavior.jsonl
        echo "Baseline seeded successfully"

  gitea_db:
    image: docker.io/library/postgres:18
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: docker.io/valkey/valkey:9.0.2-alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core_db:
    image: docker.io/library/postgres:18
    restart: always
    environment:
      - POSTGRES_HOST=core_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  spr:
    build:
      context: .
      dockerfile: cmd/spr/Containerfile
    user: root
    depends_on:
      core_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      valkey:
        condition: service_healthy
      gitea:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:7002:7002"
      - "127.0.0.1:20001:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOG_LEVEL=info
      - EXTERNAL_PORT=8080
      - INTERNAL_PORT=8081
      - DATABASE_URL=postgres://postgres:postgres@core_db:5432/core?sslmode=disable
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - VALKEY_URL=valkey:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio_pass
      - MINIO_BUCKET=behavior
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - OSS_REBUILD_CMD=${OSS_REBUILD_CMD:-/app/scripts/oss-rebuild-artifact.sh}
      - DIFFOSCOPE_CMD=${DIFFOSCOPE_CMD:-diffoscope}
      - REBUILD_WORK_DIR=${REBUILD_WORK_DIR:-/tmp/spr-rebuild}
      - OSS_REBUILD_TIMEOUT=${OSS_REBUILD_TIMEOUT:-10m}
      - DIFFOSCOPE_TIMEOUT=${DIFFOSCOPE_TIMEOUT:-2m}
      - MAX_REBUILD_ARTIFACT_SIZE=${MAX_REBUILD_ARTIFACT_SIZE:-104857600}
      - MAX_DIFFOSCOPE_REPORT_SIZE=${MAX_DIFFOSCOPE_REPORT_SIZE:-52428800}
      - SPR_MOCK=true
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard-ui:
    build:
      context: ./dashboard-ui
      dockerfile: Containerfile
      args:
        PUBLIC_HOME_BASE_URL: ${PUBLIC_HOME_BASE_URL:-http://localhost:7003}
        PUBLIC_DASHBOARD_BASE_URL: ${PUBLIC_DASHBOARD_BASE_URL:-http://localhost:7001}
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - POSTGRES_HOST=core_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=core
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-http://localhost:7001,http://127.0.0.1:7001}
    depends_on:
      core_db:
        condition: service_healthy
    restart: unless-stopped

  home-ui:
    build:
      context: ./home-ui
      dockerfile: Containerfile
      args:
        PUBLIC_DASHBOARD_BASE_URL: ${PUBLIC_DASHBOARD_BASE_URL:-http://localhost:7001}
    ports:
      - "127.0.0.1:7003:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: docker.io/caddy:2-alpine
    ports:
      - "127.0.0.1:7001:8000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/Caddyfile <<'EOF'
        :8000 {
          handle /api/* {
            reverse_proxy spr:8080
          }

          handle {
            reverse_proxy dashboard-ui:3000
          }
        }
        EOF
        caddy run --config /tmp/Caddyfile --adapter caddyfile
    restart: unless-stopped