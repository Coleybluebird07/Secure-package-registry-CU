# compose.dev.yml
services:
  dashboard-ui:
    image: docker.io/oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 3000"
    # command: sh -c "bun install --frozen-lockfile && bunx vite dev --host 0.0.0.0 --port 3000 --allowedHosts all"
    # command: sh -c "bun install --frozen-lockfile && bunx vite dev --host 0.0.0.0 --port 3000 --allowed-hosts all"
    volumes:
      - ./dashboard-ui:/app:Z
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_HOME_BASE_URL=${PUBLIC_HOME_BASE_URL:-http://localhost:7003}
      - PUBLIC_DASHBOARD_BASE_URL=${PUBLIC_DASHBOARD_BASE_URL:-http://localhost:7001}
      - POSTGRES_HOST=core_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=core
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-http://localhost:7001,http://127.0.0.1:7001,http://caddy:8000}
      - BETTER_AUTH_URL=${PUBLIC_DASHBOARD_BASE_URL:-http://localhost:7001}
      # - ORIGIN=${PUBLIC_DASHBOARD_BASE_URL:-http://localhost:7001}
      - VITE_PROXY_TARGET=http://caddy:8000
      - VITE_ALLOWED_HOSTS=caddy,localhost,127.0.0.1
      # - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=caddy,localhost,127.0.0.1
    depends_on:
      core_db:
        condition: service_healthy
    restart: unless-stopped
